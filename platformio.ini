[platformio]
src_dir = .

[env:seeed_wio_bg770a]
platform = https://github.com/SeeedJP/platform-nordicnrf52#8f55ff26c0822ffcbff978be1fddfb8c88c57577
platform_packages =
    framework-arduinoadafruitnrf52 @ https://github.com/SeeedJP/Adafruit_nRF52_Arduino.git#514f28ee405952ecc58558b5e0608a2b63d9901a
build_src_filter = +<src/grove-can-bus.cpp> +<platformio/cellular-main.cpp>
framework = arduino
board = seeed_wio_bg770a
build_flags =
    -Isrc
    -DBOARD_VERSION_1_0 ; Board version 1.0
    -DCFG_LOGGER=3      ; 3:None, 2:Segger RTT, 1:Serial1, 0:Serial
    ;-D ENABLE_TRACE    ; Enable trace
    ;-O0                ; No optimization
lib_archive = no ; https://github.com/platformio/platform-nordicnrf52/issues/119
lib_deps =
    seeedjp/WioCellular @ 0.3.16
    bblanchon/ArduinoJson @ 7.4.3

; Independent feature and transport compilation profiles.
[env:ntp_only]
extends = env:seeed_wio_bg770a
build_flags = ${env:seeed_wio_bg770a.build_flags} -DTELEMETRY_GNSS=0

[env:gnss_only]
extends = env:seeed_wio_bg770a
build_flags = ${env:seeed_wio_bg770a.build_flags} -DTELEMETRY_NTP=0

[env:can_only]
extends = env:seeed_wio_bg770a
build_flags = ${env:seeed_wio_bg770a.build_flags} -DTELEMETRY_NTP=0 -DTELEMETRY_GNSS=0

[env:can_29bit_250]
extends = env:seeed_wio_bg770a
build_flags = ${env:seeed_wio_bg770a.build_flags} -DOBD_CAN_EXTENDED=1 -DOBD_CAN_RATE=CAN_RATE_250
